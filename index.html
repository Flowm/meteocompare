<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport: no pinch-, double-tap-, or input-focus auto-zoom, so
         the app behaves like a fixed instrument panel on mobile. iOS Safari
         ignores user-scalable=no for manual pinch — see the gesture guard in
         src/main.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MeteoCompare — multi-model weather forecast</title>
    <meta name="description" content="Multi-model weather forecast comparison with a weighted aggregate and confidence score. Powered by open-meteo.com." />

    <!-- Type system: a humanist sans for body (Instrument Sans) and a mono with
         slashed-zero for all data (JetBrains Mono). Loaded from src/style.css —
         see there for why they are bundled rather than fetched. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
